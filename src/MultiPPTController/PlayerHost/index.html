<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiPPT Web Player</title>
    <link rel="stylesheet" href="./vendor/styles.css" />
    <style>
        html, body, #host {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #host {
            display: block;
        }

        .pptxv,
        .pptxv-stage,
        .pptxv-canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .pptxv-ribbon,
        .pptxv-thumbnails,
        .pptxv-status,
        .pptxv-titlebar {
            display: none !important;
        }

        .pdf-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .pdf-canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="host"></div>
    <script src="./vendor/player.js?v=pdf1"></script>
</body>
</html>
